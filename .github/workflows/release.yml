# Publishes a release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# - download-ready binaries for Windows, macOS and Linux, attached to the GitHub release;
# - the Docker image ghcr.io/<owner>/wistjet for amd64 and arm64 (Raspberry Pi, most NAS).
name: release
on:
  push:
    tags: ["v*"]

# Third-party actions are pinned to commits (tags can be moved); Dependabot keeps them
# current. Each job gets only the write access it needs.
permissions:
  contents: read

jobs:
  # One job creates the release, so the parallel builds below only add files to it.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}

  binaries:
    needs: release
    permissions:
      contents: write # upload files to the release
    strategy:
      matrix:
        # Linux binaries are built on Ubuntu 22.04: an older glibc runs on more systems
        # (Debian 12, Raspberry Pi OS) than one built on the newest Ubuntu.
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: wistjet-linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: wistjet-linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: wistjet-macos-apple-silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, name: wistjet-macos-intel }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: wistjet-windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir ${{ matrix.name }}
          cp target/${{ matrix.target }}/release/wistjet README.md LICENSE ${{ matrix.name }}/
          tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory ${{ matrix.name }}
          Copy-Item target/${{ matrix.target }}/release/wistjet.exe, README.md, LICENSE ${{ matrix.name }}/
          Compress-Archive ${{ matrix.name }} ${{ matrix.name }}.zip
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ matrix.name }}.*

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/wistjet
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # ponytail: arm64 is built under QEMU (slow, tens of minutes); split per-arch native
      # runners and merge the manifests if release time ever matters.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
