# Wistjet on a home Kubernetes cluster:
#
#   kubectl apply -f k8s/wistjet.yaml
#   kubectl logs deploy/wistjet        # shows the setup code for the first run
#
# Wistjet keeps its data in one SQLite file, so it runs as exactly one pod: `replicas: 1`
# and the `Recreate` strategy (never two pods writing to the same volume).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wistjet-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wistjet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wistjet
  template:
    metadata:
      labels:
        app: wistjet
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532 # makes the volume writable for Wistjet's user
      containers:
        - name: wistjet
          image: ghcr.io/brightclouds-be/wistjet:latest
          ports:
            - containerPort: 8080
          env:
            # Your host name goes in three places: here, WISTJET_HOSTS below, and the Ingress.
            # The address tablets use, shown during setup.
            - name: WISTJET_PUBLIC_URL
              value: "http://wistjet.thuis"
            # Host names besides IP addresses that may reach Wistjet: your ingress host.
            - name: WISTJET_HOSTS
              value: "wistjet.thuis"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 1Gi # a restore briefly holds the uploaded backup (up to 256 MiB) twice
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wistjet-data
---
apiVersion: v1
kind: Service
metadata:
  name: wistjet
spec:
  selector:
    app: wistjet
  ports:
    - port: 80
      targetPort: 8080
---
# Reaching Wistjet by name on the home network; adjust host and class to your cluster.
# Keep it on the home network: Wistjet is not meant to be exposed to the internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wistjet
spec:
  rules:
    - host: wistjet.thuis # the same name as WISTJET_PUBLIC_URL and WISTJET_HOSTS above
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wistjet
                port:
                  number: 80
