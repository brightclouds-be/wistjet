[package]
name = "wistjet"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
argon2 = "0.5"
axum = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
directories = "6"
local-ip-address = "0.6"
open = "5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
rusqlite = { version = "0.37", features = ["backup", "bundled", "chrono"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# Argon2 is unusably slow unoptimised; keep PIN tests fast in debug builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
